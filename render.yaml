# One-click deploy on Render (Blueprint). Free plan uses SQLite and re-seeds demo data on each start.
services:
  - type: web
    name: reviewpulse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_API_KEY
        sync: false
